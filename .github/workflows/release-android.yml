# Builds an installable Android APK and attaches it to a GitHub release.
#
# Runs when a release is published, or by hand from the Actions tab
# (pick the tag of the release to attach the APK to).
#
# The APK is signed with the default debug keystore from `expo prebuild`,
# which is fine for sideloading and testing but not for the Play Store.

name: Release Android APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the APK to (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # Not `npm ci`: the lockfile written on Windows lacks Linux-only optional
      # peers (@emnapi/*), which `npm ci` rejects. `npm install` still pins to it.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        # Real phones only need ARM; skipping x86 roughly halves size and build time.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk LifeSplits.apk
          gh release upload "$TAG" LifeSplits.apk --clobber
